- name: Mac setup
  hosts: mac
  gather_facts: true
  become: false

  # Docker Desktop's cask symlinks helper binaries into /usr/local/bin and
  # shells out to sudo itself. Ansible gives it no terminal to prompt on, so
  # the password has to be handed to Homebrew via SUDO_ASKPASS.
  # Note: -K does NOT populate this, which is why we prompt explicitly.
  vars_prompt:
    - name: mac_sudo_password
      prompt: |-
        macOS password (needed for Docker Desktop)
        Press Enter to skip if you already ran "sudo -v"
      private: true
      confirm: false
      default: ""

  roles:
    # Validates the environment and every package name before anything is
    # installed, so a bad name fails in seconds instead of minutes.
    - role: preflight
      tags: [always]
    - role: homebrew
      tags: [homebrew]
    - role: terraform
      tags: [terraform]
    - role: docker
      tags: [docker]
    - role: kubernetes
      tags: [kubernetes]
    - role: vscode
      tags: [vscode]
    - role: zsh
      tags: [zsh]
    # Always last: this role restarts Dock and Finder, so everything else
    # should be installed and settled before it runs.
    - role: system
      tags: [system]

  # post_tasks run after every role, including after a role failed — because
  # each role catches its own failure in a rescue block.
  post_tasks:
    - name: All roles completed successfully
      debug:
        msg: "All roles completed without errors."
      when: (mac_failed_roles | default([])) | length == 0
      tags: always

    - name: Report every role that failed
      debug:
        msg: |-
          {{ (mac_failed_roles | default([])) | length }} role(s) failed:
          {% for f in mac_failed_roles | default([]) %}
            - {{ f.role }} — at task "{{ f.task }}"
              {{ f.msg }}
          {% endfor %}
          Re-run just the failed ones, for example:
            ansible-playbook playbook.yml --tags {{ (mac_failed_roles | default([])) | map(attribute='role') | join(',') }}
      when: (mac_failed_roles | default([])) | length > 0
      tags: always

    # Still exit non-zero so CI and scripts notice, but only after the report
    # above has been printed and every other role has had its turn.
    - name: Fail the run because one or more roles failed
      fail:
        msg: >-
          {{ (mac_failed_roles | default([])) | map(attribute='role') | join(', ') }}
          failed — see the report above.
      when: (mac_failed_roles | default([])) | length > 0
      tags: always
