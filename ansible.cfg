[defaults]
inventory = inventory.ini
interpreter_python = auto_silent
nocows = 1
retry_files_enabled = False
callback_result_format = yaml

# Top-level facts (ansible_env, ansible_system, ...) are deprecated and will
# stop being injected in ansible-core 2.24. Every task here already uses the
# ansible_facts.* form, so we opt out now: this silences the deprecation
# warnings and makes a regression fail immediately instead of years from now.
inject_facts_as_vars = False
