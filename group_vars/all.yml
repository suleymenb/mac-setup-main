---
# Single source of truth for everything this playbook manages.
#
# The preflight role validates every name in this file *before* anything is
# installed, and each role installs from these same lists. Add a package here,
# nowhere else.
#
# "optional" lists never abort the run — a rename upstream (as happened with
# tflint moving out of homebrew-core) should not kill the whole playbook.

# Homebrew lives in /opt/homebrew on Apple Silicon, /usr/local on Intel.
# Ansible's command module does not use a shell, so tasks that run binaries
# need this on PATH explicitly.
brew_bin_paths: "/opt/homebrew/bin:/usr/local/bin"

# --- preflight ---------------------------------------------------------------
preflight_min_free_gb: 10
preflight_hosts:
  - github.com
  - raw.githubusercontent.com
  - ghcr.io
  - formulae.brew.sh

# --- taps --------------------------------------------------------------------
# Homebrew does not auto-tap from a fully qualified formula name.
brew_taps:
  - hashicorp/tap
  - terraform-linters/tap

# --- core CLI tooling --------------------------------------------------------
brew_formulae:
  - eza
  - dust
  - vim
  - mc
  - ansible-lint

# brew_formulae_absent:
#   - 

brew_casks:
  - iterm2
  - rectangle
  - stats
  - visual-studio-code
  - font-jetbrains-mono
  - font-meslo-lg-nerd-font

brew_casks_absent:
  - zed

# --- terraform ---------------------------------------------------------------
# terraform is not in homebrew-core (Business Source License), hence the tap.
terraform_formulae:
  - hashicorp/tap/terraform
  - terraform-docs

terraform_formulae_optional:
  - terraform-linters/tap/tflint

# --- docker ------------------------------------------------------------------
docker_cask: docker-desktop

docker_formulae:
  - docker-compose

docker_formulae_optional:
  - lazydocker
  - dive

# --- kubernetes --------------------------------------------------------------
# "kubectl" is only an alias; kubernetes-cli is the real formula name.
kubernetes_formulae:
  - kubernetes-cli
  - helm

kubernetes_formulae_optional:
  - k9s
  - kubectx
  - minikube

# --- vs code -----------------------------------------------------------------
vscode_extensions:
  - xcad2k.vscode-thedigitallife
  - PKief.material-icon-theme

vscode_theme_settings:
  workbench.colorTheme: "The Digital Life"
  workbench.iconTheme: "material-icon-theme"

# --- system settings ---------------------------------------------------------
# Applied by the system role, which always runs LAST because it restarts
# Dock and Finder.

# Strips every pinned app from the Dock, leaving only running apps and the
# Downloads/Trash side. Runs only when the Dock actually has pinned apps.
system_dock_clear_persistent_apps: true

# Appearance — applied at the very end of the system role.
system_dark_mode: true

# Also flip the *running* session via AppleScript. Leave this false unless you
# have granted your terminal Automation permission under
# System Settings > Privacy & Security > Automation. Without it the AppleEvent
# hangs. Dark mode itself works fine without this — it just needs a logout to
# reach already-running apps.
system_dark_mode_live_apply: false
# Dark app icons. Set to "" to leave the icon theme alone.
# Other values: Regular, RegularDark, Clear, ClearDark, Tinted, TintedDark
system_icon_appearance_theme: "RegularDark"

# Free-form macOS defaults. Each entry maps straight onto the osx_defaults
# module, which reads the current value first — so re-running changes nothing
# and Dock/Finder are not restarted for no reason.
#
# Find the domain and key of any setting by changing it in System Settings and
# running:  defaults read > after.txt   and diffing against a before.txt
system_defaults:
  # Turn OFF natural scrolling (content follows the finger). false = classic,
  # the scrollbar follows the finger instead. Takes effect after logout.
  - domain: NSGlobalDomain
    key: com.apple.swipescrolldirection
    type: bool
    value: false

  # More examples — uncomment what you want:
  # - domain: com.apple.dock
  #   key: autohide
  #   type: bool
  #   value: true
  # - domain: com.apple.dock
  #   key: tilesize
  #   type: int
  #   value: 48
  # - domain: com.apple.finder
  #   key: AppleShowAllFiles
  #   type: bool
  #   value: true
