---
# Core tools — the run should fail loudly if these are missing.
# "kubernetes-cli" is the canonical formula; "kubectl" is only an alias.
- name: Install core kubernetes CLI tooling
  community.general.homebrew:
    name:
      - kubernetes-cli
      - helm
    state: present
    update_homebrew: false

# Convenience tools — a rename upstream should not abort the whole playbook.
- name: Install optional kubernetes tooling
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: false
  loop:
    - k9s
    - kubectx
    - minikube
  register: k8s_optional
  failed_when: false

- name: Report optional kubernetes tools that were skipped
  debug:
    msg: "Skipped {{ item.item }} — {{ item.msg | default('unknown error') }}"
  loop: "{{ k8s_optional.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Error' in (item.msg | default(''))"

- name: Ensure kubectl completion is loaded in zsh
  blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    marker: "# {mark} ANSIBLE_KUBECTL"
    create: true
    block: |
      command -v kubectl >/dev/null 2>&1 && source <(kubectl completion zsh)
      alias k='kubectl'

- name: Verify kubectl is runnable
  command: kubectl version --client
  register: kubectl_version
  changed_when: false
  failed_when: false

- name: Show kubectl version
  debug:
    msg: "{{ kubectl_version.stdout_lines | first | default('kubectl not reporting a version') }}"
