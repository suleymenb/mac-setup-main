---
# Package names live in group_vars/all.yml.

- name: Install core kubernetes CLI tooling
  community.general.homebrew:
    name: "{{ kubernetes_formulae }}"
    state: present
    update_homebrew: false

- name: Install optional kubernetes tooling
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: false
  loop: "{{ kubernetes_formulae_optional }}"
  register: k8s_optional
  failed_when: false

- name: Report optional kubernetes tools that were skipped
  debug:
    msg: "Skipped {{ item.item }} — {{ item.msg | default('unknown error') }}"
  loop: "{{ k8s_optional.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Error' in (item.msg | default(''))"

# The kubectl completion block used to be written here. That was wrong: this
# role runs before the zsh role, so the block landed ABOVE
# "source $ZSH/oh-my-zsh.sh" — and Oh My Zsh is what runs compinit, which
# defines compdef. kubectl's completion calls compdef, so it failed with
# "command not found: compdef" on every new shell.
#
# The zsh role now owns it and appends it after Oh My Zsh. This task only
# cleans up the old, badly placed block.
- name: Remove the misplaced kubectl block from .zshrc
  blockinfile:
    path: "{{ ansible_facts.env.HOME }}/.zshrc"
    marker: "# {mark} ANSIBLE_KUBECTL"
    state: absent

- name: Verify kubectl is runnable
  command: kubectl version --client
  environment:
    PATH: "{{ brew_bin_paths }}:{{ ansible_facts.env.PATH }}"
  register: kubectl_version
  changed_when: false
  failed_when: false

- name: Show kubectl version
  debug:
    msg: "{{ kubectl_version.stdout_lines | first | default('kubectl not reporting a version') }}"
