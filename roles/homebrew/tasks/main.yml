---
# Package lists live in group_vars/all.yml — do not add names here.

- name: Ensure Homebrew is installed (best-effort)
  shell: |
    set -euo pipefail
    if ! command -v brew >/dev/null 2>&1; then
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Install brew formulae
  community.general.homebrew:
    name: "{{ brew_formulae }}"
    state: present
    update_homebrew: false

# The "_absent" lists may be empty or commented out entirely — default([])
# keeps that from blowing up with an undefined-variable error.
- name: Remove formulae that are no longer wanted
  community.general.homebrew:
    name: "{{ brew_formulae_absent | default([]) }}"
    state: absent
  when: (brew_formulae_absent | default([])) | length > 0

- name: Install brew casks
  community.general.homebrew_cask:
    name: "{{ brew_casks }}"
    state: present

- name: Remove casks that are no longer wanted
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: absent
  loop: "{{ brew_casks_absent | default([]) }}"
  failed_when: false
