- name: Ensure Homebrew is installed (best-effort)
  shell: |
    set -euo pipefail
    if ! command -v brew >/dev/null 2>&1; then
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Install brew formulae
  community.general.homebrew:
    name:
      - eza
      - dust
      - vim
      - mc
      - ansible-lint
    state: present
    update_homebrew: false

# du-dust now comes from the brew 'dust' formula, so nothing needs cargo.
- name: Remove rust (no longer required by anything in this playbook)
  community.general.homebrew:
    name: rust
    state: absent

- name: Install brew casks
  community.general.homebrew_cask:
    name:
      - iterm2
      - rectangle
      - stats
      - visual-studio-code
      - font-jetbrains-mono
      - font-meslo-lg-nerd-font
    state: present

- name: Remove the Zed editor (replaced by VS Code)
  community.general.homebrew_cask:
    name: zed
    state: absent
  register: zed_removed
  failed_when: false
