---
# Thin wrapper. The real work lives in tasks.yml.
#
# Wrapping the role in block/rescue means a failure here is recorded and the
# play continues with the next role, instead of aborting everything after it.
# Without this, one broken role hides the state of every role that follows —
# which is exactly how the system role silently never ran.
- name: terraform
  block:
    - name: Run the terraform tasks
      include_tasks: tasks.yml

  rescue:
    - name: Record that the terraform role failed
      set_fact:
        mac_failed_roles: >-
          {{ (mac_failed_roles | default([])) + [{
               'role': 'terraform',
               'task': ansible_failed_task.name | default('unknown task'),
               'msg': (ansible_failed_result.msg | default('no message')) | string | truncate(200)
             }] }}

    - name: Warn that terraform failed but the run continues
      debug:
        msg: >-
          Role 'terraform' FAILED at "{{ ansible_failed_task.name | default('unknown task') }}".
          Continuing with the remaining roles; full report at the end.
