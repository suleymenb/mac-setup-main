---
# Taps and package names live in group_vars/all.yml.
# The preflight role has already tapped and validated everything by now.

- name: Unlink any stale homebrew-core terraform
  shell: |
    set -uo pipefail
    if brew list --formula 2>/dev/null | grep -qx 'terraform'; then
      brew unlink terraform || true
    fi
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ brew_bin_paths }}:{{ ansible_env.PATH }}"
  changed_when: false

- name: Install terraform tooling
  community.general.homebrew:
    name: "{{ terraform_formulae }}"
    state: present
    update_homebrew: false

- name: Install optional terraform tooling
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: false
  loop: "{{ terraform_formulae_optional }}"
  register: tf_optional
  failed_when: false

- name: Report optional terraform tools that were skipped
  debug:
    msg: "Skipped {{ item.item }} — {{ item.msg | default('unknown error') }}"
  loop: "{{ tf_optional.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Error' in (item.msg | default(''))"

# Ansible's command module does not go through a shell, so it only sees the
# PATH it inherited — which on a fresh machine has no Homebrew in it yet.
- name: Verify terraform is runnable
  command: terraform version
  environment:
    PATH: "{{ brew_bin_paths }}:{{ ansible_env.PATH }}"
  register: terraform_version
  changed_when: false
  failed_when: false

- name: Fail with a useful message if terraform is not runnable
  fail:
    msg: >-
      terraform is installed but not reachable on PATH. Open a new terminal, or
      run:  eval "$(/opt/homebrew/bin/brew shellenv)"  and try again.
  when: terraform_version.rc != 0

- name: Show terraform version
  debug:
    msg: "{{ terraform_version.stdout_lines | first }}"
