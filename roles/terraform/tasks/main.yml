---
# Terraform is no longer shipped in homebrew-core (HashiCorp moved it to the
# Business Source License). It must come from HashiCorp's official tap.
# This is why previous runs left terraform missing/broken.

- name: Add HashiCorp homebrew tap
  community.general.homebrew_tap:
    name: hashicorp/tap
    state: present

- name: Unlink any stale homebrew-core terraform
  shell: |
    set -uo pipefail
    if brew list --formula 2>/dev/null | grep -qx 'terraform'; then
      brew unlink terraform || true
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Install terraform from HashiCorp tap
  community.general.homebrew:
    name: hashicorp/tap/terraform
    state: present
    update_homebrew: false

# tflint was moved out of homebrew-core to the terraform-linters tap.
# Homebrew does NOT auto-tap from a qualified name, so tap it explicitly first.
- name: Add terraform-linters tap
  community.general.homebrew_tap:
    name: terraform-linters/tap
    state: present
  register: tflint_tap
  failed_when: false

- name: Install tflint from the terraform-linters tap
  community.general.homebrew:
    name: terraform-linters/tap/tflint
    state: present
    update_homebrew: false
  register: tflint_install
  failed_when: false

- name: Warn if tflint could not be installed
  debug:
    msg: "tflint was skipped — {{ tflint_install.msg | default('unknown error') }}"
  when: "'Error' in (tflint_install.msg | default(''))"

- name: Install terraform-docs
  community.general.homebrew:
    name: terraform-docs
    state: present
    update_homebrew: false

# Ansible's command module does not go through a shell, so it only sees the
# PATH it inherited. On a fresh machine that PATH has no /opt/homebrew/bin yet,
# which makes a perfectly installed terraform look missing.
- name: Verify terraform is runnable
  command: terraform version
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}"
  register: terraform_version
  changed_when: false
  failed_when: false

- name: Fail with a useful message if terraform is not runnable
  fail:
    msg: >-
      terraform is installed but not reachable on PATH. Open a new terminal, or
      run:  eval "$(/opt/homebrew/bin/brew shellenv)"  and try again.
  when: terraform_version.rc != 0

- name: Show terraform version
  debug:
    msg: "{{ terraform_version.stdout_lines | first }}"
