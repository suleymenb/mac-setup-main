---
# System Appearance
#
# The osascript route ("tell System Events to set dark mode") needs macOS
# Automation permission. Under Ansible there is no UI to grant it, so the
# AppleEvent just sits there until it times out after 2 minutes (-1712).
# Writing the preference directly needs no permission and is idempotent.
- name: Enable dark mode
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleInterfaceStyle
    type: string
    value: Dark
    state: present
  register: dark_mode

# Best effort only: applies dark mode to the *running* session so you do not
# have to log out. Capped at 15s and never fatal, because it can still hit the
# Automation prompt. The setting above is what actually persists.
- name: Apply dark mode to the current session
  command: >-
    osascript -e 'tell application "System Events" to tell appearance preferences
    to set dark mode to true'
  changed_when: false
  failed_when: false
  timeout: 15
  when: dark_mode is changed

# System Preferences
- name: Show hidden files in Finder
  community.general.osx_defaults:
    domain: com.apple.finder
    key: AppleShowAllFiles
    type: bool
    value: true
    state: present
  register: finder_hidden

- name: Restart Finder to apply changes
  command: killall Finder
  changed_when: true
  failed_when: false
  when: finder_hidden is changed
