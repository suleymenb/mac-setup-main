---
# macOS system processes and settings.
#
# This role runs LAST, on purpose: it restarts Dock and Finder, so it should
# only happen once everything else is installed and settled.
#
# Settings are driven from group_vars/all.yml — add them there, not here.
# Restarts go through handlers, so Dock/Finder are only killed when something
# actually changed. Running this role twice in a row should restart nothing.

# --- Dock --------------------------------------------------------------------

- name: Count apps currently pinned to the Dock
  shell: |
    set -o pipefail
    defaults read com.apple.dock persistent-apps 2>/dev/null | grep -c 'tile-data' || true
  args:
    executable: /bin/bash
  register: dock_pinned_count
  changed_when: false

- name: Clear all pinned apps from the Dock
  command: defaults write com.apple.dock persistent-apps -array
  when:
    - system_dock_clear_persistent_apps | default(false)
    - (dock_pinned_count.stdout | trim | int) > 0
  notify: Restart Dock

- name: Report the Dock is already clear
  debug:
    msg: "Dock already has no pinned apps — nothing to do."
  when:
    - system_dock_clear_persistent_apps | default(false)
    - (dock_pinned_count.stdout | trim | int) == 0

# --- iTerm2 font -------------------------------------------------------------
# The font cask only drops files into ~/Library/Fonts. iTerm2 has to actually
# select one or Powerlevel10k shows boxes instead of icons.
#
# Two hard constraints, both handled below:
#  1. iTerm2 rewrites its whole plist when it quits. Editing the file while it
#     runs means your change is thrown away the moment you close it — so this
#     is skipped entirely while iTerm2 is running.
#  2. The font lives in a nested array ("New Bookmarks" -> per-profile dict),
#     which `defaults write` cannot address. plistlib handles it properly.

- name: Check whether iTerm2 is running
  command: pgrep -x iTerm2
  register: iterm_running
  changed_when: false
  failed_when: false
  when: system_iterm_font | default('') | length > 0

- name: Check for the iTerm2 preferences file
  stat:
    path: "{{ ansible_facts.env.HOME }}/Library/Preferences/com.googlecode.iterm2.plist"
  register: iterm_plist
  when: system_iterm_font | default('') | length > 0

- name: Set the iTerm2 font on every profile
  shell: |
    python3 - "$HOME/Library/Preferences/com.googlecode.iterm2.plist" "{{ system_iterm_font }}" <<'PY'
    import plistlib, sys
    path, font = sys.argv[1], sys.argv[2]
    with open(path, 'rb') as fh:
        data = plistlib.load(fh)
    profiles = data.get('New Bookmarks', [])
    if not profiles:
        print('NOPROFILES')
        raise SystemExit(0)
    changed = False
    for profile in profiles:
        for key in ('Normal Font', 'Non Ascii Font'):
            if profile.get(key) != font:
                profile[key] = font
                changed = True
    if changed:
        with open(path, 'wb') as fh:
            plistlib.dump(data, fh)
        print('CHANGED %d profile(s)' % len(profiles))
    else:
        print('UNCHANGED')
    PY
  args:
    executable: /bin/bash
  register: iterm_font_set
  changed_when: "'CHANGED' in (iterm_font_set.stdout | default(''))"
  failed_when: false
  when:
    - system_iterm_font | default('') | length > 0
    - iterm_plist.stat.exists | default(false)
    - iterm_running.rc | default(0) != 0

- name: Flush the preferences cache so iTerm2 sees the new font
  command: killall cfprefsd
  changed_when: false
  failed_when: false
  when: iterm_font_set is changed

- name: Explain why the iTerm2 font was not set
  debug:
    msg: >-
      {% if iterm_running.rc | default(1) == 0 %}
      iTerm2 is running, so its font was left alone — it rewrites its whole
      preferences file when it quits and would discard the change. Quit iTerm2
      and run: ansible-playbook playbook.yml --tags system
      {% else %}
      iTerm2 has no preferences file yet. Launch it once, quit it, then run:
      ansible-playbook playbook.yml --tags system
      {% endif %}
  when:
    - system_iterm_font | default('') | length > 0
    - (iterm_running.rc | default(1) == 0) or not (iterm_plist.stat.exists | default(false))

# --- default browser ---------------------------------------------------------
# Apple does not allow changing the default browser silently: macOS pops a
# confirmation dialog you have to click. The `defaultbrowser` CLI triggers that
# dialog; it cannot bypass it. So this is best-effort and never fatal.

- name: Check the current default browser
  command: defaultbrowser
  environment:
    PATH: "{{ brew_bin_paths }}:{{ ansible_facts.env.PATH }}"
  register: current_browser
  changed_when: false
  failed_when: false
  when: system_default_browser | default('') | length > 0

- name: Set the default browser
  command: "defaultbrowser {{ system_default_browser }}"
  environment:
    PATH: "{{ brew_bin_paths }}:{{ ansible_facts.env.PATH }}"
  register: set_browser
  failed_when: false
  when:
    - system_default_browser | default('') | length > 0
    - current_browser.rc | default(1) == 0
    - "'* ' ~ system_default_browser not in (current_browser.stdout | default(''))"

- name: Note that macOS asks you to confirm the browser change
  debug:
    msg: >-
      Asked macOS to make {{ system_default_browser }} the default browser.
      macOS shows a confirmation dialog for this — click "Use {{ system_default_browser | capitalize }}"
      if it appears. Verify afterwards with: defaultbrowser
  when: set_browser is not skipped

# --- generic defaults --------------------------------------------------------
# Anything added to system_defaults in group_vars/all.yml is applied here.
# osx_defaults compares the current value first, so it is properly idempotent
# and reports changed only when it really writes something.

- name: Apply macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ system_defaults | default([]) }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}"
  register: defaults_applied
  notify:
    - Restart Dock
    - Restart Finder

# --- appearance (last) -------------------------------------------------------
# Deliberately the final block in the role, and the role itself runs last.

- name: Set the icon appearance theme
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleIconAppearanceTheme
    type: string
    value: "{{ system_icon_appearance_theme }}"
    state: present
  when: system_icon_appearance_theme | default('') | length > 0
  notify:
    - Restart Dock
    - Restart Finder
    - Restart SystemUIServer

# Writing AppleInterfaceStyle needs no special permission and is what actually
# persists across logins.
- name: Enable dark mode
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleInterfaceStyle
    type: string
    value: Dark
    state: present
  when: system_dark_mode | default(false)
  register: dark_mode
  notify:
    - Restart Dock
    - Restart Finder
    - Restart SystemUIServer

# Off by default, and for good reason.
#
# This asks System Events for macOS Automation permission. There is no UI to
# grant that during an Ansible run, so the AppleEvent blocks until it times out
# (-1712). Two things that do NOT save you here:
#   - `failed_when: false` — a `timeout:` is enforced by the executor and marks
#     the task failed before failed_when is ever evaluated.
#   - `timeout: 15` — that *is* the thing that fails the task.
#
# So it runs fire-and-forget instead: async with poll 0 means Ansible starts it
# and never waits for a result, which is the only way it cannot stall the play.
# The defaults write above is what actually persists the setting.
- name: Apply dark mode to the running session (fire and forget)
  command: >-
    osascript -e 'tell application "System Events" to tell appearance preferences
    to set dark mode to true'
  async: 30
  poll: 0
  changed_when: false
  when:
    - system_dark_mode | default(false)
    - system_dark_mode_live_apply | default(false)
    - dark_mode is changed

- name: Note how dark mode takes full effect
  debug:
    msg: >-
      Dark mode is written to AppleInterfaceStyle. Dock, Finder and
      SystemUIServer restart below; already-running apps pick it up after a
      logout. Set system_dark_mode_live_apply to true only if you have granted
      Automation permission to your terminal.
  when:
    - system_dark_mode | default(false)
    - dark_mode is changed
    - not (system_dark_mode_live_apply | default(false))
