---
# Docker Desktop's cask symlinks helper binaries into /usr/local/bin, which
# needs root. Homebrew shells out to `sudo` itself, and Ansible gives it no
# terminal to prompt on — hence "sudo: a terminal is required to read the
# password". Priming the sudo credential cache before the run fixes it.
- name: Check whether sudo credentials are cached
  command: sudo -n true
  register: sudo_cached
  changed_when: false
  failed_when: false

- name: Check whether Docker.app is already present
  stat:
    path: /Applications/Docker.app
  register: docker_app

# Path A — sudo is available, so do the full install including the
# /usr/local/bin helper symlinks.
- name: Install Docker Desktop (with helper binaries)
  community.general.homebrew_cask:
    name: docker-desktop
    state: present
  when:
    - not docker_app.stat.exists
    - sudo_cached.rc == 0
  register: docker_cask_sudo

# Path B — no sudo. --no-binaries skips exactly the symlinks that need root,
# so the app itself still installs. Docker Desktop sets up its CLI in
# ~/.docker/bin on first launch anyway.
- name: Install Docker Desktop (without helper binaries, no sudo needed)
  community.general.homebrew_cask:
    name: docker-desktop
    state: present
    install_options: no-binaries
  when:
    - not docker_app.stat.exists
    - sudo_cached.rc != 0
  register: docker_cask_nosudo

- name: Re-check that Docker.app landed
  stat:
    path: /Applications/Docker.app
  register: docker_app_after

- name: Fail loudly if Docker Desktop is still missing
  fail:
    msg: >-
      Docker Desktop did not install. Try priming sudo and re-running:
      sudo -v && ansible-playbook playbook.yml --tags docker
      — or install it manually with: brew install --cask docker-desktop
  when: not docker_app_after.stat.exists

- name: Note that helper binaries were skipped
  debug:
    msg: >-
      Docker Desktop was installed without the /usr/local/bin helper symlinks
      because sudo was not available. Open Docker Desktop once and it will set
      up the docker CLI itself. To get the symlinks too, run:
      sudo -v && ansible-playbook playbook.yml --tags docker
  when:
    - sudo_cached.rc != 0
    - docker_app_after.stat.exists

- name: Install docker CLI tooling
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: false
  loop:
    - docker-compose
    - lazydocker
    - dive
  register: docker_tools
  failed_when: false

- name: Report docker tools that were skipped
  debug:
    msg: "Skipped {{ item.item }} — {{ item.msg | default('unknown error') }}"
  loop: "{{ docker_tools.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Error' in (item.msg | default(''))"

- name: Check whether the docker CLI is available
  command: docker --version
  register: docker_cli
  changed_when: false
  failed_when: false

- name: Note if Docker Desktop still needs a first manual launch
  debug:
    msg: >-
      Docker Desktop is installed but the CLI is not on PATH yet.
      Open Docker Desktop once from Applications to finish setup.
  when: docker_cli.rc != 0
