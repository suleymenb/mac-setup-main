---
# Package names live in group_vars/all.yml.
#
# Docker Desktop's cask symlinks helper binaries into /usr/local/bin, which
# needs root. Homebrew shells out to `sudo` itself and Ansible gives it no
# terminal to prompt on — hence "sudo: a terminal is required to read the
# password". There is no --no-binaries escape hatch; Homebrew links
# /usr/local/bin/kubectl regardless. So the password has to reach Homebrew
# through SUDO_ASKPASS, or sudo must already be cached.

- name: Check whether Docker.app is already present
  stat:
    path: /Applications/Docker.app
  register: docker_app

- name: Install Docker Desktop
  community.general.homebrew_cask:
    name: "{{ docker_cask }}"
    state: present
    sudo_password: "{{ mac_sudo_password if (mac_sudo_password | default('') | length > 0) else omit }}"
  when: not docker_app.stat.exists
  register: docker_cask_install
  failed_when: false
  no_log: true

- name: Re-check that Docker.app landed
  stat:
    path: /Applications/Docker.app
  register: docker_app_after

- name: Fail loudly if Docker Desktop is still missing
  fail:
    msg: >-
      Docker Desktop did not install — Homebrew needs root to link its helper
      binaries into /usr/local/bin. Fix it in one of two ways:
      (1) re-run and type your macOS password at the prompt, or
      (2) sudo -v && ansible-playbook playbook.yml --tags docker
  when: not docker_app_after.stat.exists

- name: Install docker CLI tooling
  community.general.homebrew:
    name: "{{ docker_formulae }}"
    state: present
    update_homebrew: false

- name: Install optional docker tooling
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: false
  loop: "{{ docker_formulae_optional }}"
  register: docker_tools
  failed_when: false

- name: Report optional docker tools that were skipped
  debug:
    msg: "Skipped {{ item.item }} — {{ item.msg | default('unknown error') }}"
  loop: "{{ docker_tools.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Error' in (item.msg | default(''))"

- name: Check whether the docker CLI is available
  command: docker --version
  environment:
    PATH: "{{ brew_bin_paths }}:{{ ansible_facts.env.PATH }}"
  register: docker_cli
  changed_when: false
  failed_when: false

- name: Note if Docker Desktop still needs a first manual launch
  debug:
    msg: >-
      Docker Desktop is installed but the CLI is not on PATH yet.
      Open Docker Desktop once from Applications to finish setup.
  when: docker_cli.rc != 0
