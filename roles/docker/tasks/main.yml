---
- name: Install Docker Desktop
  community.general.homebrew_cask:
    name: docker-desktop
    state: present

- name: Install docker CLI tooling
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: false
  loop:
    - docker-compose
    - lazydocker
    - dive
  register: docker_tools
  failed_when: false

- name: Report docker tools that were skipped
  debug:
    msg: "Skipped {{ item.item }} — {{ item.msg | default('unknown error') }}"
  loop: "{{ docker_tools.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Error' in (item.msg | default(''))"

- name: Check whether the docker CLI is available
  command: docker --version
  register: docker_cli
  changed_when: false
  failed_when: false

- name: Note if Docker Desktop still needs a first manual launch
  debug:
    msg: >-
      Docker Desktop is installed but the CLI is not on PATH yet.
      Open Docker Desktop once from Applications to finish setup.
  when: docker_cli.rc != 0
